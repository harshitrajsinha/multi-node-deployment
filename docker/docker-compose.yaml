services:
  db:
    image: postgres:alpine3.23
    container_name: social_db
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_DB_FILE: /run/secrets/postgres_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password    # Password file located in container
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ${HOME}/projects/aws/social-media-app/db/db-init:/docker-entrypoint-initdb.d
      - social_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]  # ensure no errors due to trailing slashes
      interval: 30s # Checks every 30 seconds
      timeout: 5s # Allows 5 seconds per check
      retries: 3
      start_period: 60s # Allows 60 seconds for initial startup
    deploy:
      resources:
        limits:
          cpus: '1.5'      # Maximum 75% of total CPU core
          memory: 3G      # Maximum 80% of RAM
        reservations:
          cpus: '1'      # Guaranteed minimum 50% of total CPU core
          memory: 2G      # Guaranteed minimum 50% of RAM
    secrets:
      - postgres_password
      - postgres_user
      - postgres_db

volumes:
  social_db_data:

secrets:
  postgres_password:
    file: ${HOME}/projects/aws/social-media-app/db/postgres_password   # Password file located on host machine
  postgres_user:
    file: ${HOME}/projects/aws/social-media-app/db/postgres_user  
  postgres_db:
    file: ${HOME}/projects/aws/social-media-app/db/postgres_name



